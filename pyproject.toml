[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "heterodisagg"
version = "0.1.0"
description = "Hardware-Aware Disaggregated Serving & Asymmetric Parallelism for Heterogeneous Clusters"
readme = "README.md"
authors = [{ name = "Aravind Sundaresan" }]
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1.0",
    "pydantic>=2.0.0",
    "rich>=13.0.0",
    "click>=8.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
hetero-prof = "hetero_prof.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
